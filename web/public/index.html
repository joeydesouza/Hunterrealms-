<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunter Realms</title>
<style>
  :root { --bg:#14181d; --card:#1f252c; --ink:#e9e4d8; --muted:#9aa3ab; --accent:#c9a24a; --err:#e06c6c; --ok:#7cc47c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border-radius:12px; padding:24px; }
  h1 { margin:0 0 4px; font-size:26px; color:var(--accent); letter-spacing:.5px; }
  p.sub { margin:0 0 20px; color:var(--muted); }
  label { display:block; font-size:14px; color:var(--muted); margin:14px 0 6px; }
  input, select { width:100%; padding:12px; border-radius:8px; border:1px solid #39414a; background:#12161a;
                  color:var(--ink); font-size:16px; }
  button { margin-top:22px; width:100%; padding:14px; border:0; border-radius:8px; background:var(--accent);
           color:#1a1405; font-weight:700; font-size:16px; }
  #msg { margin-top:14px; min-height:1.5em; }
  .err { color:var(--err); } .ok { color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Hunter Realms</h1>
  <p class="sub">Create your account and first hunter.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password (8+ characters)</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="name">Character name</label>
    <input id="name" placeholder="e.g. Swift Arrow" required>
    <label for="sex">Character</label>
    <select id="sex"><option value="1">Male</option><option value="0">Female</option></select>
    <button type="submit">Create account</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = ''; msg.textContent = 'Creating...';
  try {
    const res = await fetch('/api/register', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        characterName: document.getElementById('name').value.trim(),
        sex: Number(document.getElementById('sex').value),
      }),
    });
    const data = await res.json();
    if (data.ok) { msg.className = 'ok'; msg.textContent = 'Done! Open the Hunter Realms app and log in with your email and password.'; }
    else { msg.className = 'err'; msg.textContent = data.error || 'Something went wrong.'; }
  } catch { msg.className = 'err'; msg.textContent = 'Could not reach the server.'; }
});
</script>
</body>
</html>
