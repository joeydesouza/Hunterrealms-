name: Android APK

on:
  workflow_dispatch:
    inputs:
      login_url:
        description: "Login service URL the app connects to (e.g. http://192.168.1.50:8080/login)"
        required: true
        default: "http://192.168.1.50:8080/login"
      login_port:
        description: "Port of that URL"
        required: true
        default: "8080"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Generate game assets
        run: |
          pip install grpcio-tools==1.66.2 pillow==10.4.0
          tools/build_all.sh - build

      - name: Fetch pinned OTClient
        run: |
          source VERSIONS
          git clone "$OTCLIENT_REPO" otclient
          git -C otclient checkout "$OTCLIENT_COMMIT"

      - name: Apply Hunter Realms overlay
        run: client/assemble.sh otclient build/assets "${{ inputs.login_url }}" "${{ inputs.login_port }}"

      - name: Build APK (Docker, Android NDK)
        working-directory: otclient
        run: |
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.android --target apk-artifacts \
            --output type=local,dest=../apk .

      - uses: actions/upload-artifact@v4
        with:
          name: hunterrealms-apk
          path: apk/**/*.apk
